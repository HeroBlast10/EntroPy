# ============================================================
# EntroPy Data Layer Configuration
# ============================================================

# --- Paths ---
paths:
  data_root: "data"                # relative to project root
  prices_dir: "prices"
  universe_dir: "universe"
  fundamentals_dir: "fundamentals"
  manifest_file: "manifest.json"

# --- Date Range ---
date_range:
  start: "2010-01-01"
  end: "2026-07-21"

# --- Exchange / Calendar ---
exchange:
  calendar: "XNYS"                # NYSE calendar (covers NASDAQ hours too)
  currency: "USD"

# --- Universe Filters ---
universe:
  # "sp500" downloads today's constituents only.  It is a research seed and
  # must not be interpreted as historical point-in-time membership.
  index_membership: "sp500"
  # Optional CSV/Parquet with ticker,membership_start,membership_end.
  # Required when data_contract.mode is "production".
  membership_file: null
  min_listing_days: 60             # exclude stocks listed < N trading days
  min_price: 1.0                   # exclude penny stocks (close < $1)
  min_market_cap: 5.0e+7           # $50M minimum market cap
  exclude_otc: true                # exclude OTC / pink sheets
  
  # Dynamic universe: liquidity-filtered large-cap stocks
  # Selects top N stocks by market cap that meet liquidity threshold
  # This approximates major indices (e.g., S&P 500) using actual market data
  top_n_by_mcap: 500               # select top 500 stocks by market cap
  min_avg_dollar_volume: 5.0e+6    # $5M minimum average daily dollar volume
  adv_window_days: 30              # window for computing average dollar volume

# --- Adjustment Factor ---
adjustment:
  # "split_only" = only adjust for splits (no dividend reinvestment)
  # "total_return" = adjust for splits + dividends
  method: "total_return"
  # point_in_time: use the adjustment factor known AS OF each date
  # (avoids look-ahead bias from retroactive corrections)
  point_in_time: true

# --- Fundamental Data ---
fundamentals:
  # SimFin dataset variant: "free" or "plus"
  simfin_variant: "free"
  # API key: set SIMFIN_API_KEY in the environment; never commit credentials.
  simfin_api_key: null
  # Which statements to pull
  statements:
    - "income"
    - "balance"
    - "cashflow"
  # Lag (calendar days) to apply after report_date to avoid look-ahead bias
  publication_lag_days: 45

# --- Data Provenance Contract ---
data_contract:
  # The bundled/default data is suitable for exploratory research but is not
  # fully PIT because current-constituent and yfinance fallbacks may be used.
  mode: "research"                  # "research" or fail-closed "production"
  allow_non_pit_fundamentals: true # ignored (forced false) in production

# --- Data Versioning ---
versioning:
  auto_tag: true                   # create git tag on each build
  tag_prefix: "data-v"
